<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Model-based win, draw and loss probabilities for upcoming fixtures in Europe's top football leagues." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)" />
    <title>Upcoming — Match Predictor</title>
    <script>
      // Apply the saved colour theme (ft.theme.v1: "light" | "dark"; absent = system)
      // before first paint. Mirrors applyThemePref in src/lib/theme.js.
      (function () {
        try {
          var t = window.localStorage.getItem('ft.theme.v1');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* storage blocked: follow the system theme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
