server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy the API. Docker's embedded DNS plus a variable keeps nginx from
    # failing to start if the app container is not resolvable yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /upcoming queries several leagues sequentially and can be slow.
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed files under /assets/.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback; the internal redirect lands on the index.html rule above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
